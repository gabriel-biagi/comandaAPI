<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processador de Comanda WhatsApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="loginScreen" class="screen active">
        <div class="container">
            <h1>Login</h1>
            
            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="admin">
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha">
            </div>

            <button id="btnLogin" class="primary">Entrar</button>
            
            <div id="loginStatus" class="status-message"></div>
        </div>
    </div>

    <!-- Tela de Comanda -->
    <div id="comandaScreen" class="screen">
        <div class="container">
            <div class="header">
                <h1>Processador de Comanda</h1>
                <button id="btnLogout" class="logout-btn">Sair</button>
            </div>

            <!-- Seção de Entrada -->
            <div class="input-group">
                <label for="inputTexto">Texto do WhatsApp</label>
                <textarea id="inputTexto" placeholder="Cole ou digite o texto recebido aqui..."></textarea>
                <div class="button-group">
                    <button type="button" id="btnColar" class="secondary">Colar da Área de Transferência</button>
                    <button type="button" id="btnEnviar">
                        <span class="btn-text">Enviar</span>
                        <div class="spinner" id="spinner"></div>
                    </button>
                </div>
            </div>

            <!-- Seção de Resultado -->
            <div class="input-group">
                <label for="outputTexto">Resultado Retornado</label>
                <textarea id="outputTexto" placeholder="O resultado editável aparecerá aqui..." readonly></textarea>
                <div class="button-group">
                    <button type="button" id="btnCopiar" class="secondary">Copiar Resultado</button>
                </div>
            </div>

            <div id="comandaStatus" class="status-message"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
